/* ============================================================
   MODE SOMBRE — variables, bascule, corrections
   ============================================================ */
:root{
  --surface:#FFFFFF; --tint:#F4FAF6; --tint2:#E7F6EC; --track:#ECEEF1; --bd:#D3E9DB;
  --bd-amber:#F5E3B8; --bd-red:#F3C6BD; --bd-green:#BFEAD2;
  --text2:#4B5563; --muted:#9CA3AF; --amber-ink:#7A5200; --red-ink:#8F2410; --green-ink:#14532D;
  --topbar-bg:rgba(243,244,246,.86); --overlay:rgba(255,255,255,.96);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F0D; --surface:#151C18; --navy:#FFFFFF; --gray:#9CA3AF; --line:#25302A; --line2:#1C2620;
  --blue:#22C55E; --blue-bg:#14301F; --green:#22C55E; --green-bg:#0F2E1C; --amber:#F2B04C; --amber-bg:#33270F;
  --red:#FF8068; --red-bg:#391A18;
  --tint:#18231D; --tint2:#1B3023; --track:#212C26; --bd:#2B3A31; --bd-amber:#5A4416; --bd-red:#5E2A24; --bd-green:#1F5A33;
  --text2:#D1D5DB; --muted:#8A939E; --amber-ink:#F5C26B; --red-ink:#FFA08E; --green-ink:#86EFAC;
  --topbar-bg:rgba(11,15,13,.84); --overlay:rgba(11,15,13,.96);
  --sh:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.7);
  --sh-lg:0 2px 6px rgba(0,0,0,.45),0 26px 52px -22px rgba(0,0,0,.8);
}
html[data-theme="dark"] body{background:var(--bg)}
/* éléments qui restent blancs en mode sombre (logo, QR code, boutons sur fond coloré) */
html[data-theme="dark"] .switch i::after,html[data-theme="dark"] .tb-logo,html[data-theme="dark"] .rf-solid,
html[data-theme="dark"] .rf-qrframe,html[data-theme="dark"] .wd-un-steps li.now .n,html[data-theme="dark"] .wd-ok-ico,
html[data-theme="dark"] .wd-un-cta .btn,html[data-theme="dark"] .wd-ok .btn{background:#fff}
html[data-theme="dark"] .rf-linkbox input{background:#fff;color:#0F3D22}
html[data-theme="dark"] .rf-solid{color:#16A34A}
html[data-theme="dark"] .btn-danger,html[data-theme="dark"] .adm-danger-solid{background:#D63D24;color:#fff}
html[data-theme="dark"] .btn-primary,html[data-theme="dark"] .ref-pill{color:#fff}
html[data-theme="dark"] .bnav-item.center,html[data-theme="dark"] .bnav-item.center.active{box-shadow:0 0 0 5px var(--surface),0 16px 26px -10px rgba(22,163,74,.6)}
html[data-theme="dark"] .bnav-item.center.active{box-shadow:0 0 0 5px var(--surface),0 0 0 8px rgba(34,197,94,.28),0 16px 26px -10px rgba(22,163,74,.7)}
html[data-theme="dark"] .bottomnav{box-shadow:0 10px 34px -8px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4)}
html[data-theme="dark"] .modal-back,html[data-theme="dark"] .modal-overlay{background:rgba(2,8,5,.72)}
html[data-theme="dark"] ::placeholder{color:#6B7280}
html[data-theme="dark"] .input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #1B261F inset;-webkit-text-fill-color:#FFFFFF}
/* fonds pastel écrits directement dans le HTML généré */
html[data-theme="dark"] [style*="background:#E7F6EC"]{background:rgba(34,197,94,.18)!important}
html[data-theme="dark"] [style*="background:#DDF5E6"]{background:rgba(34,197,94,.16)!important}
html[data-theme="dark"] [style*="background:#FFF4E0"],html[data-theme="dark"] [style*="background:#FFF4D6"],html[data-theme="dark"] [style*="background:#FDEEE3"]{background:rgba(242,176,76,.17)!important}
html[data-theme="dark"] [style*="background:#EAF9F0"]{background:rgba(61,214,140,.16)!important}
html[data-theme="dark"] [style*="background:#FEEBEB"]{background:rgba(255,128,104,.17)!important}
html[data-theme="dark"] [style*="background:#F0EDFF"]{background:rgba(139,115,255,.2)!important}
html[data-theme="dark"] [style*="background:#ECEEF1"],html[data-theme="dark"] [style*="background:#F4FAF6"]{background:var(--track)!important}
html[data-theme="dark"] [style*="background:#F4FAF6"]{background:var(--tint)!important}
html[data-theme="dark"] [style*="color:#B25E00"]{color:#F2B04C!important}
html[data-theme="dark"] [style*="color:#C13515"]{color:#FF8068!important}
html[data-theme="dark"] [style*="color:#0B9A57"]{color:#3DD68C!important}
html[data-theme="dark"] [style*="color:#C1652F"]{color:#F2995E!important}
html[data-theme="dark"] [style*="color:#15803D"]{color:#4ADE80!important}
html[data-theme="dark"] [style*="color:#6B4EFF"]{color:#A998FF!important}
html[data-theme="dark"] [style*="color:#16A34A"]{color:#4ADE80!important}
html[data-theme="dark"] [style*="color:#4B5563"]{color:var(--text2)!important}
html[data-theme="dark"] [style*="color:#6B7280"],html[data-theme="dark"] [style*="color:#9CA3AF"]{color:var(--muted)!important}
html[data-theme="dark"] [style*="color:#8F2410"]{color:var(--red-ink)!important}
html[data-theme="dark"] [style*="color:#7A5200"]{color:var(--amber-ink)!important}
html[data-theme="dark"] [style*="border-color:#F3C6BD"]{border-color:var(--bd-red)!important}
html[data-theme="dark"] [style*="border-color:#F5E3B8"]{border-color:var(--bd-amber)!important}
/* bascule animée (désactivée si mouvement réduit) */
html.theme-anim,html.theme-anim *{transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease!important}
html.reduce-motion.theme-anim,html.reduce-motion.theme-anim *{transition:none!important}
/* sélecteur d'apparence */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--track);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;background:transparent;color:var(--gray);font:inherit;font-size:12.5px;font-weight:800;padding:8px 12px;border-radius:10px;cursor:pointer;transition:.18s}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--surface);color:var(--blue);box-shadow:0 2px 8px -2px rgba(15,61,34,.28)}
html[data-theme="dark"] .seg button.on{box-shadow:0 2px 10px -2px rgba(0,0,0,.6)}
.theme-row{flex-wrap:wrap;gap:12px}
@media(max-width:480px){.theme-row .seg{width:100%}.theme-row .seg button{flex:1}}
@media(max-width:350px){.theme-btn{display:none}}

/* ============================================================
   CLICASH — logo, pièce Cli, encadré de solde
   ============================================================ */
.tb-logo{background:transparent;padding:0;border:none;box-shadow:none;border-radius:24%;overflow:visible}
.tb-logo .brand-img{border-radius:24%}
html[data-theme="dark"] .tb-logo{background:transparent}
.cli-ico{width:24px;height:24px;object-fit:contain;flex:none;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(15,61,34,.35));user-select:none;-webkit-user-drag:none}
.cli-ico.xs{width:16px;height:16px}.cli-ico.sm{width:18px;height:18px}.cli-ico.md{width:30px;height:30px}.cli-ico.lg{width:46px;height:46px}
.tb-balance{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 13px 0 7px;border-radius:14px;border:1px solid var(--bd);background:var(--surface);
  color:var(--navy);font:inherit;cursor:pointer;flex:none;min-width:0;box-shadow:var(--sh);transition:transform .18s,border-color .18s}
.tb-balance:hover{border-color:var(--blue);transform:translateY(-1px)}
.tb-balance:active{transform:scale(.97)}
.tb-balance .cli-ico{width:28px;height:28px}
.tb-balance b{font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.2px;white-space:nowrap}
.tbb-unit{font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;color:var(--blue)}
.bc-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.bc-row .cli-ico{filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.vc-v{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:399px){.theme-btn{display:none}.ref-pill{padding:0 11px 0 10px;font-size:12.5px;gap:6px}.tb-actions{gap:7px}.tb-balance{padding:0 10px 0 6px;gap:6px}.tb-balance b{font-size:14px}}
@media(max-width:340px){.ref-pill span{display:none}.ref-pill{padding:0 12px}}

/* ---------- Portefeuille : actions sous la carte ---------- */
.wl-actions{margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:460px;width:100%}
.wl-actions .btn{width:100%;min-width:0;padding:10px 6px;font-size:12.5px;justify-content:center;text-align:center;border-radius:12px;gap:6px;white-space:nowrap}
.wl-actions .btn svg{width:15px;height:15px;flex:none}
@media(max-width:540px){
  .wl-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wl-actions .wl-btn-hide{grid-column:1 / -1}
}
/* ---------- Installer l'application ---------- */
.pwa-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;background:linear-gradient(120deg,var(--surface),var(--tint2));border-color:var(--bd)}
.pwa-ico{width:46px;height:46px;flex:none;display:flex}
.pwa-ico .brand-img{width:100%;height:100%;object-fit:contain;border-radius:24%}
.pwa-txt{flex:1 1 200px;min-width:0}
.pwa-txt h4{font-size:15px}
.pwa-txt p{font-size:12.5px;color:var(--gray);margin-top:2px}
.pwa-txt p svg{width:14px;height:14px;vertical-align:-2px;color:var(--blue)}
.pwa-card .btn{flex:none}
.pwa-x{width:34px;height:34px;flex:none}
@media(max-width:480px){.pwa-card .btn:not(.icon-btn){width:100%;order:3}}

/* ---------- Marketplace électronique ---------- */
.market-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:2px 0 18px;flex-wrap:wrap}
.market-heading h1{font-size:clamp(25px,4vw,34px);letter-spacing:-.8px;margin-top:4px}
.market-heading p{color:var(--gray);font-size:13.5px;margin-top:6px}
.dash-kicker{display:inline-flex;font-size:10px;font-weight:800;letter-spacing:1.2px;color:var(--green)}
.market-balance-chip{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:13px;font-weight:800;box-shadow:var(--sh)}
.market-balance-chip>svg{width:18px;color:var(--green)}
.market-banner{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:24px;min-height:230px;margin:0 0 15px;padding:30px;border-radius:24px;color:#fff;background:radial-gradient(circle at 82% 40%,rgba(74,222,128,.36),transparent 30%),linear-gradient(120deg,#0F3D22,#166534 60%,#16A34A);box-shadow:var(--sh-lg)}
.market-banner>div:first-child{position:relative;z-index:1;max-width:570px}
.market-banner span{font-size:10px;letter-spacing:1.4px;font-weight:800;opacity:.8}
.market-banner h2{font-size:clamp(22px,3.5vw,30px);margin:8px 0}
.market-banner p{font-size:13px;opacity:.85;max-width:480px;margin-bottom:18px}
.market-banner-art{height:160px;min-width:280px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff}
.market-banner-art svg{position:absolute;width:106px;height:134px;padding:23px;border:1px solid rgba(255,255,255,.3);border-radius:22px;background:rgba(255,255,255,.14);box-shadow:0 20px 42px rgba(0,0,0,.16);transform:rotate(-8deg)}
.market-banner-art svg:nth-child(2){width:128px;height:92px;transform:translate(75px,23px) rotate(7deg)}
.market-banner-art svg:nth-child(3){width:76px;height:76px;padding:16px;transform:translate(-86px,46px) rotate(8deg)}
.market-disclaimer,.deposit-warning{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;margin:13px 0 20px;border:1px solid var(--bd-amber);border-radius:13px;background:var(--amber-bg);color:var(--amber);font-size:12.5px;line-height:1.5}
.market-disclaimer svg,.deposit-warning svg{width:17px;height:17px;flex:none;margin-top:1px}
.market-filters{display:flex;flex-direction:column;gap:12px;margin:20px 0 18px}
.market-search{display:flex;align-items:center;gap:8px;max-width:440px;position:relative}
.market-search>svg{position:absolute;left:13px;width:17px;color:var(--muted)}
.market-search .input{padding-left:40px;background:var(--surface)}
.market-category-chips{display:flex;gap:8px;overflow:auto;padding:2px 0 5px;scrollbar-width:thin}
.market-category-chips .chip{white-space:nowrap}
.market-grid,.inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,265px),1fr));gap:16px}
.product-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.product-image{height:180px;position:relative;overflow:hidden;background:var(--tint)}
.product-image img,.product-detail-image img,.inventory-image img,.product-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.product-image>.badge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.91);color:#1f2937}
.product-card-body{padding:16px;display:flex;flex-direction:column;flex:1}
.product-id{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.product-card h3{font-size:16px;margin:4px 0 6px}
.product-card-body>p{font-size:12.5px;color:var(--gray);min-height:50px;line-height:1.5}
.product-price-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px;padding:11px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.product-price-row>div{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:8px}
.product-price-row small,.inventory-values small,.detail-price-grid small{display:block;color:var(--muted);font-size:10.5px}
.product-price-row b{font-family:'Manrope';font-size:16px}
.product-price-row>div small:last-child{grid-column:1/-1}
.product-price-row .badge{white-space:nowrap}
.product-mini-chart{display:flex;align-items:center;gap:10px;margin-top:10px}
.product-mini-chart>span{font-size:10px;color:var(--muted)}
.market-spark{display:block;width:100%;height:44px;overflow:visible}
.market-spark polyline{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.market-spark.large{height:130px;margin:14px 0 3px}
.market-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.market-card-head h2,.market-card-head h3{font-size:16px;margin:0}
.market-card-head p{font-size:11.5px;color:var(--muted);margin-top:4px}
.product-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px}
.product-card-foot>span{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
.product-card-foot>span svg{width:14px;height:14px}
.product-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,1fr);gap:24px;align-items:start}
.product-detail-image{height:420px;border-radius:22px;overflow:hidden;background:var(--tint);box-shadow:var(--sh)}
.product-detail-info{padding:8px 0}
.product-detail-info h1{font-size:clamp(24px,4vw,32px);margin:7px 0}
.product-detail-info>p{font-size:14px;color:var(--gray);line-height:1.7}
.detail-price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.detail-price-grid>div{padding:12px 10px;background:var(--surface);border:1px solid var(--line);border-radius:13px}
.detail-price-grid b{display:block;font-size:15px;font-family:'Manrope';margin-top:5px}
.detail-trend{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.product-detail-actions{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin:22px 0 12px}
.product-detail-actions>span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.product-detail-actions>span svg{width:15px;height:15px}
.market-note{font-size:11.5px;color:var(--muted);line-height:1.55;margin:10px 0}
.market-history-card{margin-top:18px}
.market-chart-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.inventory-card{padding:0;overflow:hidden;display:grid;grid-template-columns:150px 1fr;gap:0}
.inventory-image{min-height:100%;background:var(--tint)}
.inventory-body{padding:15px;min-width:0}
.inventory-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.inventory-top h3{font-size:15px;margin:3px 0 7px}
.inventory-values{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0 8px}
.inventory-values>div{padding:8px;background:var(--tint);border-radius:10px}
.inventory-values b{display:block;font-family:'Manrope';font-size:13px;margin-top:3px}
.positive{color:var(--green)}.negative{color:var(--red)}
.inventory-foot{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted)}
.inventory-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.resale-list,.delivery-list{display:grid;gap:15px}
.resale-card{padding:18px}
.delivery-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.product-thumb{width:68px;height:58px;border-radius:11px;overflow:hidden;background:var(--tint);flex:none}
.delivery-product{display:flex;flex-direction:column;gap:3px;flex:1;min-width:140px}
.delivery-product>b{font-family:'Manrope';font-size:14px}
.delivery-product>span{font-size:10.5px;color:var(--muted)}
.resale-net{margin-left:auto;text-align:right}
.resale-net small{display:block;color:var(--muted);font-size:10px}
.resale-net b{font-family:'Manrope';font-size:16px;color:var(--green)}
.resale-values{display:flex;flex-wrap:wrap;gap:8px 18px;margin:15px 0 8px;color:var(--gray);font-size:11px}
.resale-progress{height:7px;margin:10px 0}
.delivery-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.delivery-meta>div{display:flex;flex-direction:column;gap:3px}
.delivery-meta small{font-size:10px;color:var(--muted)}
.delivery-meta b{font-size:11.5px}
.route-map{margin-top:16px;padding:16px;background:linear-gradient(145deg,var(--tint),var(--surface));border:1px solid var(--line);border-radius:14px}
.route-title{display:flex;align-items:center;gap:7px;font-weight:800;font-size:12px}
.route-title svg{width:16px;height:16px;color:var(--blue)}
.route-line{display:flex;align-items:center;justify-content:space-between;margin:17px 7% 5px;height:2px;background:linear-gradient(90deg,var(--green),var(--blue));position:relative}
.route-point{position:relative;width:11px;height:11px;border:2px solid var(--blue);background:var(--surface);border-radius:50%;z-index:1}
.route-point.done{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
.route-stops{display:flex;justify-content:space-between;gap:5px;font-size:9px;color:var(--muted)}
.delivery-card{padding:18px}
.market-dashboard-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:4px 0 16px;padding:24px;border-radius:22px;background:linear-gradient(120deg,#0F3D22,#166534 58%,#16A34A);color:#fff;box-shadow:var(--sh-lg)}
.market-dashboard-hero h2{font-size:22px;margin:5px 0}
.market-dashboard-hero p{font-size:12px;opacity:.82}
.market-dashboard-hero .dash-kicker{color:#bbf7d0}
.dash-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.dash-balance{min-width:180px;padding:16px;border:1px solid rgba(255,255,255,.26);border-radius:16px;background:rgba(255,255,255,.12);display:flex;flex-direction:column}
.dash-balance small,.dash-balance>span{font-size:10.5px;opacity:.8}
.dash-balance b{font:800 28px 'Manrope';margin:4px 0}
.dash-balance b span{font-size:13px}
.market-stats{margin-bottom:16px}
.home-quick{margin-bottom:18px}

/* ---------- Évolution de l'inventaire ---------- */
.market-value-card{display:flex;flex-direction:column;justify-content:space-between;min-height:280px}
.inv-evo-val-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.inv-evo-val{font-size:24px;font-family:'Manrope',sans-serif;font-weight:800;color:var(--navy)}
.inv-evo-val span{font-size:14px;color:var(--gray);font-weight:700}
.inv-evo-count{font-size:12px;color:var(--gray);font-weight:600}
.inv-evo-chart-wrap{margin-top:auto}
.inv-evo-svg{display:block;width:100%;height:120px;overflow:visible}
.inv-evo-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 10px;margin:auto 0;background:var(--tint);border-radius:14px;gap:8px}
.inv-evo-empty-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--blue-bg);color:var(--blue)}
.inv-evo-empty-icon svg{width:22px;height:22px}
.inv-evo-empty-txt h4{font-size:14px;font-weight:800;margin:0 0 4px}
.inv-evo-empty-txt p{font-size:12px;color:var(--gray);max-width:320px;margin:0}
html[data-theme="dark"] .inv-evo-val{color:#fff}
html[data-theme="dark"] .inv-evo-empty{background:rgba(255,255,255,.03)}

/* ---------- Barre du haut ultra-fluide (évite les cassures avec grands montants) ---------- */
@media(max-width:480px){
  .topbar{padding:10px 14px}
  .tb-balance{padding:0 8px 0 6px;gap:5px;height:38px;max-width:140px}
  .tb-balance .cli-ico{width:24px;height:24px}
  .tb-balance b{font-size:13.5px}
  .tbb-unit{font-size:11px}
  .tb-actions{gap:6px}
  .icon-btn{width:36px;height:36px}
  .avatar{width:34px;height:34px}
}
@media(max-width:420px){
  .ref-pill{padding:0 9px;height:36px;gap:0}
  .ref-pill span{display:none}
  .tb-balance{max-width:120px}
  .tb-actions{gap:4px}
}
@media(max-width:340px){
  .theme-btn{display:none}
}

/* ---------- Listes défilantes (barre de défilement) ---------- */
.scroll-list{
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:6px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:rgba(22,163,74,.35) transparent;
}
.scroll-list::-webkit-scrollbar{
  width:6px;
}
.scroll-list::-webkit-scrollbar-track{
  background:transparent;
}
.scroll-list::-webkit-scrollbar-thumb{
  background:rgba(22,163,74,.3);
  border-radius:99px;
}
.scroll-list::-webkit-scrollbar-thumb:hover{
  background:rgba(22,163,74,.55);
}
html[data-theme="dark"] .scroll-list{
  scrollbar-color:rgba(34,197,94,.4) transparent;
}
html[data-theme="dark"] .scroll-list::-webkit-scrollbar-thumb{
  background:rgba(34,197,94,.35);
}
html[data-theme="dark"] .scroll-list::-webkit-scrollbar-thumb:hover{
  background:rgba(34,197,94,.65);
}
.home-tx-scroll{
  max-height:285px;
}
.wallet-tx-scroll{
  max-height:380px;
}
.home-quick button.card{font-family:inherit;color:inherit;width:100%;border:1px solid var(--line2);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:18px 10px;border-radius:var(--r);transition:transform .2s,box-shadow .2s,border-color .2s}
.home-quick button.card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:var(--sh-lg)}
.home-quick button.card:active{transform:scale(.98)}
.market-dashboard-grid{margin-bottom:16px;align-items:stretch}
.market-value-card,.market-dash-list{min-width:0}
.market-dash-list>.market-card-head{margin-bottom:10px}
.market-dash-list h3{font-size:16px}
.market-feature-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.market-feature-row img{width:50px;height:46px;object-fit:cover;border-radius:10px}
.market-feature-row>div{display:flex;flex:1;flex-direction:column;gap:3px;min-width:0}
.market-feature-row b{font-size:12px}
.market-feature-row span{font-size:10.5px;color:var(--muted)}
.deposit-panel{margin:0 0 22px}
.deposit-panel .market-card-head{align-items:center}
.deposit-panel .market-card-head h2{font-size:20px;margin:4px 0}
.deposit-panel .market-card-head p{max-width:560px;font-size:12px}
.deposit-form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:end}
.deposit-form>button{margin-bottom:14px}
.deposit-preview{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:8px 14px;margin:0 0 14px;padding:13px;background:var(--tint);border-radius:12px;font-size:12px}
.deposit-preview span{color:var(--gray)}
.deposit-preview b{text-align:right}
.deposit-history{margin-top:18px;padding-top:15px;border-top:1px solid var(--line2)}
.deposit-history h3{font-size:14px;margin-bottom:8px}
.checkout-product{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:10px;background:var(--tint);border-radius:14px}
.checkout-product img{width:66px;height:58px;object-fit:cover;border-radius:10px}
.checkout-product>div{display:flex;flex-direction:column;gap:4px}
.checkout-product b{font-size:14px}
.checkout-product span{font-size:11px;color:var(--muted)}
.checkout-total{display:grid;grid-template-columns:1fr auto;gap:9px 14px;margin:14px 0;padding:14px;background:var(--tint);border-radius:13px;font-size:12.5px}
.checkout-total>span{color:var(--gray)}
.checkout-total>strong{padding-top:8px;border-top:1px solid var(--line);font-size:14px}
@media(max-width:760px){
  .market-banner{min-height:unset;padding:22px}.market-banner-art{min-width:115px;width:115px;height:130px}.market-banner-art svg{width:78px;height:105px;padding:16px}
  .market-banner-art svg:nth-child(2){width:88px;height:67px;transform:translate(32px,20px) rotate(7deg)}
  .market-banner-art svg:nth-child(3){width:58px;height:58px;transform:translate(-43px,41px) rotate(8deg)}
  .product-detail{grid-template-columns:1fr;gap:12px}.product-detail-image{height:300px}
  .inventory-card{grid-template-columns:105px 1fr}.inventory-image{min-height:100%}.inventory-body{padding:12px}
  .inventory-values{grid-template-columns:1fr 1fr}.inventory-values>div:last-child{grid-column:1/-1}
  .market-dashboard-hero{align-items:flex-start;flex-direction:column;padding:20px}.dash-balance{width:100%}
  .deposit-form{grid-template-columns:1fr}.deposit-preview{grid-column:auto}
}
@media(max-width:480px){
  .market-heading{align-items:flex-start}.market-balance-chip{flex-wrap:wrap}
  .market-banner-art{display:none}.detail-price-grid{grid-template-columns:1fr 1fr}
  .inventory-card{grid-template-columns:1fr}.inventory-image{height:170px}
  .inventory-values{grid-template-columns:1fr 1fr}
  .delivery-meta{grid-template-columns:1fr 1fr}.route-stops{font-size:8px}
  .market-stats{grid-template-columns:1fr 1fr}
  .product-price-row .badge{font-size:9px;padding:4px 6px}
}

</style>

  const memory=new Map();let native=null;
  try{native=window.localStorage;const probe='__clicash_storage_probe__';native.setItem(probe,'1');native.removeItem(probe);}catch(e){native=null;}
  return {
    getItem(key){try{const value=native&&native.getItem(key);if(value!==null&&value!==undefined){memory.set(key,value);return value;}}catch(e){}return memory.has(key)?memory.get(key):null;},
    setItem(key,value){value=String(value);memory.set(key,value);try{if(native)native.setItem(key,value);}catch(e){}},
    removeItem(key){memory.delete(key);try{if(native)native.removeItem(key);}catch(e){}}
  };
})();

/* ---------- Encadré de solde réactif & compact (barre du haut) ---------- */
function compactCli(n){
  n = Math.round(Number(n) || 0);
  if(n >= 1000000){
    const m = n / 1000000;
    const decimals = m >= 100 ? 0 : (m >= 10 ? 1 : 2);
    let s = m.toFixed(decimals);
    if(s.includes('.')) s = s.replace(/\.?0+$/, '');
    return s.replace('.', ',') + 'M';
  }
  return fmt(n);
}

async function hashPwd(pwd,salt){ const d=new TextEncoder().encode(salt+'::'+pwd); const b=await crypto.subtle.digest('SHA-256',d); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function logSecurity(userId,event,details){ Store.mutate(db=>db.security_logs.unshift({id:uid(),userId,event,details:details||'',date:new Date().toISOString()})); }

const Session={ key:'monempire.session',
  set(userId){ SafeStorage.setItem(this.key, JSON.stringify({userId, token:genCode(24), exp:Date.now()+7*864e5})); },
  current(){ try{ const s=JSON.parse(SafeStorage.getItem(this.key)); if(!s) return null; if(Date.now()>s.exp){ this.clear(); return {expired:true}; } return s; }catch(e){ return null; } },
  clear(){ SafeStorage.removeItem(this.key); } };

const Auth={
  currentUser(){ const s=Session.current(); if(!s||s.expired) return null;
    const db=Store.read(); const u=db.users.find(x=>x.id===s.userId&&!x.isSeed);
    if(!u){ Session.clear(); return null; }
    return {...u, settings: db.user_settings.find(x=>x.userId===u.id)||{}}; },
  async signup(d){
    const db=Store.read();
    if(db.users.some(u=>u.email.toLowerCase()===d.email.toLowerCase()&&!u.isSeed)) throw new Error('Un compte existe déjà avec cette adresse e-mail.');
    if(db.users.some(u=>u.pseudo.toLowerCase()===d.pseudo.toLowerCase())) throw new Error('Ce pseudo est déjà pris.');
    const salt=genCode(12), pass=await hashPwd(d.password,salt), now=new Date().toISOString(), id='u-'+uid();
    Store.mutate(db=>{
      db.users.push({id, nom:d.nom, prenom:d.prenom, pseudo:d.pseudo, email:d.email, phone:d.phone, pass, salt, emailVerified:false, avatar:null, devices:[Device.id()], createdAt:now});
      db.wallets.push({userId:id, balance:0, pending:0, totalEarned:0, accountNo:'ME26-'+Math.floor(100000+Math.random()*900000), status:'actif', createdAt:now});
      db.referrals.push({userId:id, code:Referral.newCode(db), invited:0, confirmed:0, verified:0, createdAt:now});
      db.user_settings.push({userId:id, notifEmail:true, notifPush:true, language:'fr', display:'confort', privacyLeaderboard:true});
    });
    logSecurity(id,'inscription','Compte créé');
    Auth.lastReferral=Referral.applyPending(id);
    Session.set(id);
    Notif.add(id,{title:'Bienvenue sur Clicash', msg:'Ton espace marketplace est prêt. Explore le catalogue et consulte ton portefeuille CLI.', cat:'systeme'});
    return id;
  },
  async login(ident,pwd){
    const db=Store.read(); const now=Date.now();
    const fails=db.security_logs.filter(l=>l.event==='echec_connexion'&&now-new Date(l.date)<5*60000);
    if(fails.length>=5) throw new Error('Trop de tentatives. Réessaie dans 5 minutes.');
    const u=db.users.find(x=>!x.isSeed&&(x.email.toLowerCase()===ident.toLowerCase()||x.pseudo.toLowerCase()===ident.toLowerCase()));
    if(!u){ logSecurity(null,'echec_connexion',ident); throw new Error('Identifiants incorrects.'); }
    const h=await hashPwd(pwd,u.salt);
    if(h!==u.pass){ logSecurity(u.id,'echec_connexion','Mot de passe erroné'); throw new Error('Identifiants incorrects.'); }
    Session.set(u.id); logSecurity(u.id,'connexion','Session ouverte'); touchDevice(u.id); Referral.reconcile(u.id);
    return u;
  },
  logout(){ const u=Auth.currentUser(); if(u) logSecurity(u.id,'deconnexion','Session fermée'); Session.clear(); },
  requestCode(userId){ const code=genCode(6); Store.mutate(db=>{ const u=db.users.find(x=>x.id===userId); u.pendingCode=code; u.codeExp=Date.now()+10*60000; }); return code; },
  verifyEmail(userId,code){ return Store.mutate(db=>{ const u=db.users.find(x=>x.id===userId);
    if(!u.pendingCode||u.pendingCode!==code||Date.now()>(u.codeExp||0)) return false;
    u.emailVerified=true; delete u.pendingCode; delete u.codeExp; return true; }); },
  async changePassword(userId,oldP,newP){
    const u=Store.read().users.find(x=>x.id===userId);
    if(await hashPwd(oldP,u.salt)!==u.pass) throw new Error('Mot de passe actuel incorrect.');
    const salt=genCode(12); const pass=await hashPwd(newP,salt);
    Store.mutate(db=>{ const uu=db.users.find(x=>x.id===userId); uu.pass=pass; uu.salt=salt; });
    logSecurity(userId,'changement_mdp','Mot de passe modifié');
  },
  findForReset(email){ const u=Store.read().users.find(x=>!x.isSeed&&x.email.toLowerCase()===email.toLowerCase());
    if(!u) throw new Error('Aucun compte ne correspond à cette adresse.');
    const code=genCode(6); Store.mutate(db=>{ const uu=db.users.find(x=>x.id===u.id); uu.pendingCode=code; uu.codeExp=Date.now()+10*60000; });
    return {userId:u.id, code}; },
  async resetPassword(userId,code,newP){
    const ok=Store.mutate(db=>{ const u=db.users.find(x=>x.id===userId);
      if(!u.pendingCode||u.pendingCode!==code||Date.now()>(u.codeExp||0)) return false;
      delete u.pendingCode; delete u.codeExp; return true; });
    if(!ok) throw new Error('Code invalide ou expiré.');
    const salt=genCode(12), pass=await hashPwd(newP,salt);
    Store.mutate(db=>{ const u=db.users.find(x=>x.id===userId); u.pass=pass; u.salt=salt; });
    logSecurity(userId,'reinitialisation_mdp','Mot de passe réinitialisé');
  }
};

const MARKET_TRANSPORTS=[
  {id:'air',name:'Avion',price:12000,extra:1800,daysMin:3,daysMax:7},
  {id:'train',name:'Train',price:7000,extra:1200,daysMin:7,daysMax:14},
  {id:'road',name:'Voiture ou camion',price:5000,extra:900,daysMin:10,daysMax:21},
  {id:'boat',name:'Bateau',price:3500,extra:1400,daysMin:25,daysMax:45},
  {id:'digital',name:'Livraison numérique',price:0,extra:0,daysMin:0,daysMax:0}
];
const Market={
  today(){return Math.floor(Date.now()/86400000);},
  product(id){return Store.read().market_products.find(x=>x.id===id)||null;},
  quoteAt(p,day){
    const seed=Array.from(p.id).reduce((n,c)=>(n*31+c.charCodeAt(0))%997,17);
    const start=Math.floor(Date.UTC(2026,0,1)/86400000);
    let value=p.price;
    for(let d=start;d<=day;d++){
      const wave=Math.sin((d+seed)*.19)*Math.min(.12,(Number(p.trendSeed)||4)/100)+Math.sin((d+seed*.7)*.071)*.045;
      const target=p.price*(1+wave+Math.sin((d+seed)*.012)*.035);
      const low=Math.max(p.price*MARKET_RULES.minFactor,value*(1-MARKET_RULES.dailyCap));
      const high=Math.min(p.price*MARKET_RULES.maxFactor,value*(1+MARKET_RULES.dailyCap));
      value=Math.max(low,Math.min(high,target));
    }
    return Math.max(1,Math.round(value));
  },
  quote(p){return this.quoteAt(p,this.today());},
  history(p,count){
    count=count||14;const out=[];
    for(let i=count-1;i>=0;i--)out.push(this.quoteAt(p,this.today()-i));
    return out;
  },
  trend(p){const a=this.quoteAt(p,this.today()-1),b=this.quote(p),delta=(b-a)/a;
    return Math.abs(delta)<.003?{name:'Stable',icon:'minus',className:'b-gray',delta:0}:{name:delta>0?'En hausse':'En baisse',icon:delta>0?'trending-up':'trending-down',className:delta>0?'b-green':'b-red',delta};},
  inventory(userId){return Store.read().market_inventory.filter(x=>x.ownerId===userId);},
  resales(userId){return Store.read().market_resales.filter(x=>x.userId===userId);},
  shipments(userId){return Store.read().market_shipments.filter(x=>x.userId===userId);},
  currentValue(item,day){const p=this.product(item.productId);return p?this.quoteAt(p,day===undefined?this.today():day):item.purchasePrice;},
  transport(id){return MARKET_TRANSPORTS.find(x=>x.id===id)||MARKET_TRANSPORTS[2];},
  buy(userId,productId,transportId,destination){
    const transport=this.transport(transportId), now=new Date(), date=now.toISOString();
    return Store.mutate(db=>{
      const p=db.market_products.find(x=>x.id===productId), w=db.wallets.find(x=>x.userId===userId);
      if(!p||p.stock<1)return {ok:false,err:'Ce produit n’est plus disponible.'};
      if(!w)return {ok:false,err:'Portefeuille introuvable.'};
      if(p.category==='Produits numériques'&&transportId!=='digital')return {ok:false,err:'Choisis la livraison numérique pour ce produit.'};
      if(p.category!=='Produits numériques'&&transportId==='digital')return {ok:false,err:'Ce produit nécessite un transport physique.'};
      const price=p.price,total=price+transport.price+transport.extra;
      if(w.balance<total)return {ok:false,err:'Solde insuffisant. Il te manque '+fmt(total-w.balance)+' CLI.'};
      const arrival=new Date(now.getTime()+(transport.daysMin+transport.daysMax)*43200000).toISOString();
      const itemId='INV-'+uid(),shipmentId='SHP-'+uid(),ref='TX-'+genCode(7),tracking='CL-'+genCode(9);
      w.balance-=total;p.stock-=1;
      const shipment={id:shipmentId,itemId,userId,productId,transportId,destination:destination.trim(),origin:'Lomé, Togo',tracking,price:transport.price,extra:transport.extra,createdAt:date,estimatedArrivalAt:arrival,status:'Transporteur à connecter'};
      const item={id:itemId,ownerId:userId,productId,purchasePrice:price,deliveryPrice:transport.price+transport.extra,purchasedAt:date,status:'En attente de livraison',shipmentId};
      db.market_inventory.unshift(item);db.market_shipments.unshift(shipment);
      db.wallet_transactions.unshift({id:uid(),userId,type:'achat',label:'Achat marketplace · '+p.name,amount:price,status:'confirmé',ref,date,meta:{productId,itemId}});
      if(transport.price+transport.extra)db.wallet_transactions.unshift({id:uid(),userId,type:'livraison',label:'Transport · '+p.name,amount:transport.price+transport.extra,status:'confirmé',ref:'TX-'+genCode(7),date,meta:{shipmentId,transportId}});
      return {ok:true,item,shipment,total};
    });
  },
  requestResale(userId,itemId){
    const date=new Date(),now=date.toISOString();
    return Store.mutate(db=>{
      const item=db.market_inventory.find(x=>x.id===itemId&&x.ownerId===userId);
      if(!item)return {ok:false,err:'Produit introuvable dans ton inventaire.'};
      if(db.market_resales.some(x=>x.itemId===itemId&&['Demande enregistrée','En attente de traitement'].includes(x.status)))return {ok:false,err:'Une demande de revente est déjà en cours.'};
      const p=db.market_products.find(x=>x.id===item.productId);if(!p)return {ok:false,err:'Produit indisponible.'};
      const gross=this.quote(p),fee=Math.ceil(gross*MARKET_RULES.resaleFee),endsAt=new Date(date.getTime()+7*86400000).toISOString();
      const resale={id:'RSL-'+uid(),itemId,userId,productId:item.productId,purchasePrice:item.purchasePrice,currentValue:gross,fee,net:gross-fee,createdAt:now,estimatedAt:endsAt,status:'En attente de traitement',tracking:'RS-'+genCode(8)};
      db.market_resales.unshift(resale);item.resalePreviousStatus=item.status;item.status='Revente demandée';
      return {ok:true,resale};
    });
  },
  cancelResale(userId,resaleId){
    return Store.mutate(db=>{
      const r=db.market_resales.find(x=>x.id===resaleId&&x.userId===userId&&x.status==='En attente de traitement');
      if(!r)return {ok:false,err:'Cette demande ne peut plus être annulée.'};
      r.status='Annulée';r.cancelledAt=new Date().toISOString();
      const item=db.market_inventory.find(x=>x.id===r.itemId);if(item){item.status=item.resalePreviousStatus||'En attente de livraison';delete item.resalePreviousStatus;}
      return {ok:true};
    });
  },
  requestDeposit(userId,amount,method){
    amount=Number(amount);
    if(!Number.isInteger(amount)||amount<1000||amount%100!==0)return {ok:false,err:'Saisis un montant d’au moins 1 000 F CFA, par tranches de 100.'};
    const row={id:'DEP-'+uid(),userId,amount,cli:amount,fee:0,method,status:'Prestataire non connecté',createdAt:new Date().toISOString(),reference:'DP-'+genCode(8)};
    Store.mutate(db=>db.market_deposits.unshift(row));return {ok:true,row};
  }
};
function inventoryEvolutionHTML(u, summary, values, hide){
  const mask = v => hide ? '•• •••' : fmt(v);
  const hasItems = summary.items && summary.items.length > 0;
  const currentVal = values[values.length - 1] || 0;
  const startVal = values[0] || 0;
  const delta = startVal > 0 ? ((currentVal - startVal) / startVal) * 100 : 0;
  const trendSign = delta > 0 ? '+' : '';
  const trendText = hasItems ? (trendSign + delta.toFixed(1).replace('.', ',') + ' % sur 7 j') : '0 article';
  const badgeCls = !hasItems ? 'b-gray' : (delta >= 0 ? 'b-green' : 'b-red');
  const badgeIco = !hasItems ? 'package' : (delta >= 0 ? 'trending-up' : 'trending-down');

  let body = '';
  if(!hasItems){
    body = '<div class="inv-evo-empty">'
      +'<div class="inv-evo-empty-icon">' + ic('package-open') + '</div>'
      +'<div class="inv-evo-empty-txt"><h4>Aucun produit dans ton inventaire</h4>'
      +'<p>Achète des articles sur la marketplace pour suivre l’évolution de leur estimation virtuelle ici.</p></div>'
      +'<button class="btn btn-primary btn-sm" onclick="go(\'market\')">' + ic('shopping-bag') + 'Découvrir la marketplace</button>'
      +'</div>';
  } else {
    const w = 520, h = 130, pad = 10;
    const min = Math.min(...values), max = Math.max(...values), span = (max - min) || 1;
    const pts = values.map((v, i) => {
      const x = pad + i * (w - 2 * pad) / (values.length - 1);
      const y = h - pad - ((v - min) * (h - 2 * pad) / span);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    const lastPt = pts[pts.length - 1].split(',');
    const areaPts = [pad + ',' + (h - pad), ...pts, (w - pad) + ',' + (h - pad)].join(' ');
    const ptsStr = pts.join(' ');

    body = '<div class="inv-evo-chart-wrap">'
      +'<svg class="inv-evo-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">'
      +'<defs>'
      +'<linearGradient id="invEvoGrad" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0%" stop-color="#16A34A" stop-opacity="0.3"/>'
      +'<stop offset="100%" stop-color="#16A34A" stop-opacity="0.02"/>'
      +'</linearGradient>'
      +'</defs>'
      +'<line x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + (h - pad) + '" stroke="var(--line2)" stroke-width="1"/>'
      +'<polygon points="' + areaPts + '" fill="url(#invEvoGrad)"/>'
      +'<polyline points="' + ptsStr + '" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
      +'<circle cx="' + lastPt[0] + '" cy="' + lastPt[1] + '" r="5" fill="#16A34A" stroke="#fff" stroke-width="2"/>'
      +'</svg>'
      +'<div class="market-chart-labels"><span>Il y a 7 jours</span><span>Aujourd’hui</span></div>'
      +'</div>';
  }

  return '<section class="card market-value-card">'
    +'<div class="market-card-head">'
    +'<div><h3>Évolution de ton inventaire</h3><p>Estimation virtuelle sur 7 jours</p></div>'
    +'<span class="badge ' + badgeCls + '">' + ic(badgeIco) + trendText + '</span>'
    +'</div>'
    +'<div class="inv-evo-val-row">'
    +'<div class="inv-evo-val"><b>' + mask(summary.value) + '</b> <span>CLI</span></div>'
    +'<div class="inv-evo-count">' + (hasItems ? (summary.items.length + ' article' + (summary.items.length > 1 ? 's' : '') + ' possédé' + (summary.items.length > 1 ? 's' : '')) : 'Inventaire non approvisionné') + '</div>'
    +'</div>'
    + body
    +'</section>';
}

const Device={ key:'monempire.device',
  id(){ let d=null; try{ d=SafeStorage.getItem(this.key); }catch(e){}
    if(!d){ d='dv-'+genCode(14); try{ SafeStorage.setItem(this.key,d); }catch(e){} } return d; } };
function touchDevice(userId){ const d=Device.id();
  Store.mutate(db=>{ const u=db.users.find(x=>x.id===userId); if(!u) return;
    u.devices=u.devices||[]; if(!u.devices.includes(d)) u.devices.push(d); }); }

/* ---------- Parrainage : lien, code, filleuls, statut ---------- */
const REF_RE=/^(EMP|MNX)-[A-Z0-9]{6}$/;
const Referral={
  PKEY:'monempire.ref',
  normalize(c){ c=String(c==null?'':c).trim().toUpperCase().replace(/\s+/g,'');
    return /^[A-Z]{3}[A-Z0-9]{6}$/.test(c)?c.slice(0,3)+'-'+c.slice(3):c; },
  valid(c){ return REF_RE.test(c); },
  newCode(db){ let c; do{ c='MNX-'+genCode(6); }while(db.referrals.some(r=>r.code===c)); return c; },
  get(userId){ let r=Store.read().referrals.find(x=>x.userId===userId);
    if(!r) Store.mutate(db=>{ r={userId,code:this.newCode(db),invited:0,confirmed:0,verified:0,createdAt:new Date().toISOString()}; db.referrals.push(r); });
    this.sync(userId); return Store.read().referrals.find(x=>x.userId===userId); },
  /* Garde les compteurs de la table referrals alignés sur les relations réelles */
  sync(userId){ const db=Store.read(); const r=db.referrals.find(x=>x.userId===userId); if(!r) return;
    const rel=db.referral_relations.filter(x=>x.referrerId===userId);
    const verified=rel.filter(x=>{ const u=db.users.find(y=>y.id===x.refereeId); return u&&u.emailVerified; }).length;
    if(r.invited!==rel.length||r.confirmed!==rel.length||r.verified!==verified)
      Store.mutate(()=>{ r.invited=rel.length; r.confirmed=rel.length; r.verified=verified; }); },
  baseUrl(){ return location.href.split('#')[0].split('?')[0]; },
  linkFor(code){ return this.baseUrl()+'?ref='+encodeURIComponent(code); },
  link(userId){ return this.linkFor(this.get(userId).code); },
  findByCode(code){ code=this.normalize(code); const db=Store.read(); const r=db.referrals.find(x=>x.code===code); if(!r) return null;
    const u=db.users.find(x=>x.id===r.userId&&!x.isSeed); return u?{user:u,ref:r}:null; },

  /* Code reçu via un lien : conservé jusqu'à l'inscription */
  capture(code){ code=this.normalize(code); if(!this.valid(code)) return false;
    try{ SafeStorage.setItem(this.PKEY,JSON.stringify({code,at:new Date().toISOString()})); }catch(e){ return false; } return true; },
  pending(){ try{ const p=JSON.parse(SafeStorage.getItem(this.PKEY)); return (p&&this.valid(p.code))?p:null; }catch(e){ return null; } },
  clearPending(){ try{ SafeStorage.removeItem(this.PKEY); }catch(e){} },

  /* Association filleul → parrain. Une seule association par filleul, jamais d'auto-parrainage. */
  attach(refereeId,code,deviceId){
    code=this.normalize(code);
    const db0=Store.read(); const referee=db0.users.find(x=>x.id===refereeId);
    if(!referee||!this.valid(code)) return {ok:false,reason:'invalide'};
    if(db0.referral_relations.some(x=>x.refereeId===refereeId)) return {ok:false,reason:'deja_parraine'};
    const found=this.findByCode(code);
    if(!found){ Store.mutate(()=>{ referee.referredByCode=code; }); return {ok:false,reason:'en_attente',code}; }
    const sp=found.user;
    const digits=s=>String(s||'').replace(/\D/g,'').slice(-8);
    if(sp.id===referee.id||String(sp.email).toLowerCase()===String(referee.email).toLowerCase()||(digits(sp.phone)&&digits(sp.phone)===digits(referee.phone))){
      Store.mutate(()=>{ delete referee.referredByCode; });
      logSecurity(referee.id,'parrainage_refuse','Auto-parrainage bloqué ('+code+')');
      return {ok:false,reason:'auto_parrainage'}; }
    if(new Date(sp.createdAt)>new Date(referee.createdAt)){ Store.mutate(()=>{ delete referee.referredByCode; }); return {ok:false,reason:'ordre'}; }
    const sameDevice=!!(deviceId&&(sp.devices||[]).includes(deviceId));
    Store.mutate(db=>{ db.referral_relations.push({id:uid(),referrerId:sp.id,refereeId:referee.id,code,deviceId:deviceId||null,sameDevice,createdAt:new Date().toISOString()});
      referee.referredBy=sp.id; referee.referredByCode=code; });
    this.sync(sp.id);
    logSecurity(referee.id,'parrainage','Associé au parrain @'+sp.pseudo+' ('+code+')');
    if(sameDevice) logSecurity(referee.id,'parrainage_suspect','Même appareil que le parrain ('+code+')');
    Notif.add(sp.id,{title:'Nouveau filleul',msg:referee.prenom+' (@'+referee.pseudo+') vient de rejoindre Clicash avec ton lien.',cat:'parrainage'});
    return {ok:true,sponsor:sp};
  },
  applyPending(refereeId){ const p=this.pending(); if(!p) return null;
    const res=this.attach(refereeId,p.code,Device.id()); this.clearPending(); return res; },
  /* Rattache un code mémorisé mais introuvable lors de l'inscription, dès qu'il devient résolvable */
  reconcile(userId){ const u=Store.read().users.find(x=>x.id===userId);
    if(u&&u.referredByCode&&!u.referredBy) this.attach(userId,u.referredByCode,Device.id()); },

  /* Filleuls et statut Actif / Inactif */
  lastActivity(userId){ const db=Store.read(); const ts=[];
    db.wallet_transactions.forEach(x=>{ if(x.userId===userId&&x.type!=='parrainage') ts.push(x.date); });
    db.market_inventory.forEach(x=>{ if(x.ownerId===userId) ts.push(x.purchasedAt); });
    db.market_resales.forEach(x=>{ if(x.userId===userId) ts.push(x.createdAt); });
    db.security_logs.forEach(x=>{ if(x.userId===userId&&x.event==='connexion') ts.push(x.date); });
    return ts.length?ts.reduce((a,b)=>new Date(a)>new Date(b)?a:b):null; },
  list(referrerId){ const db=Store.read();
    return db.referral_relations.filter(x=>x.referrerId===referrerId).map(x=>{
      const u=db.users.find(y=>y.id===x.refereeId); if(!u) return null;
      const last=this.lastActivity(u.id);
      return {user:u, since:u.createdAt||x.createdAt, last, active:!!last&&(Date.now()-new Date(last))<=CONFIG.REFERRAL_ACTIVE_DAYS*864e5}; })
      .filter(Boolean).sort((a,b)=>new Date(b.since)-new Date(a.since)); },
  stats(referrerId){ const list=this.list(referrerId); const now=new Date(); const months=[];
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({y:d.getFullYear(),m:d.getMonth(),label:d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''),count:0}); }
    list.forEach(x=>{ const d=new Date(x.since); const b=months.find(k=>k.y===d.getFullYear()&&k.m===d.getMonth()); if(b) b.count++; });
    const active=list.filter(x=>x.active).length;
    return {total:list.length,active,inactive:list.length-active,thisMonth:months[5].count,rate:list.length?Math.round(active/list.length*100):0,months,list}; },
  steps(userId){ const db=Store.read(); const u=db.users.find(x=>x.id===userId);
    return [
      {t:'Adresse e-mail vérifiée', ok:!!u.emailVerified},
      {t:'Numéro de téléphone renseigné', ok:!!u.phone},
      {t:'Photo de profil ajoutée', ok:!!u.avatar},
      {t:'Premier achat marketplace', ok:db.market_inventory.some(x=>x.ownerId===userId)} ]; }
};

  add(userId,n){ Store.mutate(db=>db.notifications.unshift({id:uid(),userId,title:n.title,msg:n.msg,cat:n.cat||'systeme',read:false,date:new Date().toISOString()})); },
  list(userId){ return Store.read().notifications.filter(n=>n.userId===userId); },
  unread(userId){ return this.list(userId).filter(n=>!n.read).length; },
  markRead(id){ Store.mutate(db=>{ const n=db.notifications.find(x=>x.id===id); if(n)n.read=true; }); },
  markAll(userId){ Store.mutate(db=>db.notifications.forEach(n=>{ if(n.userId===userId)n.read=true; })); }

    if($('#su-code').value.trim().toUpperCase()!==_captcha){setErr('su-code','Code de sécurité incorrect.');ok=false;}

    catch(err){ toast(err.message,'err','alert-triangle'); }

/* ================================================================
   RETRAIT — moteur de règles (couche « serveur » locale)
   ----------------------------------------------------------------
   Toutes les règles financières vivent ICI, jamais dans l'interface :
   l'écran ne fait qu'appeler WD.* / UnlockPay.*, qui revérifient tout.
   Quand Supabase sera branché, ces fonctions deviennent des RPC
   (security definer) avec les mêmes contrôles : voir le schéma SQL.
   ================================================================ */
const WD_DEFAULTS={ enabled:true, minFirst:1000, minNext:8000, unlockFee:3000,
  merchants:{ tmoney:'', flooz:'', mmoney:'' } };
const fcfa=n=>fmt(n)+' F CFA';
const WD_PHONE_RE=/^\+?[0-9 ]{8,15}$/;
const wdErr=m=>({ok:false,err:m});

/* Types d'objectifs : chaque valeur est calculée à partir des données réelles du compte */
const WD_OBJ_TYPES=[
  {id:'total_earned',   label:'Cli gagnés (cumul)',        unit:'F CFA',    get:(db,u)=>((db.wallets.find(w=>w.userId===u.id)||{}).totalEarned)||0},
      {id:'referrals_total',label:'Filleuls inscrits',             unit:'filleuls', get:(db,u)=>db.referral_relations.filter(r=>r.referrerId===u.id).length},
  {id:'referrals_active',label:'Filleuls actifs',              unit:'filleuls', get:(db,u)=>Referral.list(u.id).filter(x=>x.active).length},
      {id:'account_age',    label:'Ancienneté du compte',          unit:'jours',    get:(db,u)=>Math.floor((Date.now()-new Date(u.createdAt))/864e5)},
  {id:'email_verified', label:'Adresse e-mail vérifiée',       bool:true,       get:(db,u)=>u.emailVerified?1:0},
  {id:'phone_set',      label:'Numéro de téléphone renseigné', bool:true,       get:(db,u)=>u.phone?1:0},
  {id:'avatar_set',     label:'Photo de profil ajoutée',       bool:true,       get:(db,u)=>u.avatar?1:0},
  {id:'payout_set',     label:'Moyen de paiement enregistré',  bool:true,       get:(db,u)=>u.payout?1:0}
];
const wdObjType=id=>WD_OBJ_TYPES.find(t=>t.id===id);

/* ---------- Administrateur (mode local : à remplacer par un rôle serveur) ---------- */
const Admin={
  is(u){ return !!u&&(CONFIG.ADMIN_EMAILS||[]).map(e=>String(e).toLowerCase()).includes(String(u.email).toLowerCase()); },
  me(){ const u=Auth.currentUser(); return this.is(u)?u:null; }
};

const WD={
  OPEN:['en attente','validé'],          /* demande en cours de traitement */
  COUNTED:['en attente','validé','payé'],/* demandes comptant comme « déjà demandé » */

  /* ----- configuration (modifiable par l'admin) ----- */
  cfg(){ const s=((Store.read().app_settings||{}).withdraw)||{};
    return Object.assign({},WD_DEFAULTS,s,{merchants:Object.assign({},WD_DEFAULTS.merchants,s.merchants||{})}); },
  saveCfg(p){ if(!Admin.me()) return wdErr('Accès réservé à l\u2019administrateur.');
    const n=k=>Number(p[k]); const ints=['minFirst','minNext','unlockFee'];
    for(const k of ints){ if(!Number.isInteger(n(k))||n(k)<0) return wdErr('Les montants doivent être des nombres entiers positifs.'); }
    if(n('minFirst')<1||n('minNext')<1) return wdErr('Les montants minimums doivent être supérieurs à 0.');
    const merchants={}; for(const k of ['tmoney','flooz','mmoney']){ const v=String(p.merchants&&p.merchants[k]||'').trim(); if(v&&!WD_PHONE_RE.test(v)) return wdErr('Numéro marchand invalide ('+k+').'); merchants[k]=v; }
    Store.mutate(db=>{ db.app_settings=db.app_settings||{}; db.app_settings.withdraw={enabled:!!p.enabled,minFirst:n('minFirst'),minNext:n('minNext'),unlockFee:n('unlockFee'),merchants}; });
    logSecurity(Admin.me().id,'admin_parametres','Paramètres de retrait modifiés'); return {ok:true}; },
  methodName(id){ const m=CONFIG.WITHDRAW.methods.find(x=>x.id===id); return m?m.name:id; },

  /* ----- moyen de paiement du client ----- */
  payout(userId){ const u=Store.read().users.find(x=>x.id===userId); return (u&&u.payout)||null; },
  savePayout(userId,d){
    if(!CONFIG.WITHDRAW.methods.some(m=>m.id===d.method)) return wdErr('Choisis un moyen de paiement.');
    const phone=String(d.phone||'').trim(); if(!WD_PHONE_RE.test(phone)) return wdErr('Numéro invalide (8 à 15 chiffres, avec ou sans +).');
    if(this.open(userId)) return wdErr('Impossible de modifier le moyen de paiement tant qu\u2019une demande est en cours.');
    Store.mutate(db=>{ const u=db.users.find(x=>x.id===userId); u.payout={method:d.method,phone,updatedAt:new Date().toISOString()}; });
    logSecurity(userId,'retrait_paiement','Moyen de paiement enregistré : '+this.methodName(d.method)); return {ok:true}; },

  /* ----- demandes ----- */
  requestsOf(userId){ return (Store.read().withdrawal_requests||[]).filter(r=>r.userId===userId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); },
  open(userId){ return this.requestsOf(userId).find(r=>this.OPEN.includes(r.status))||null; },
  isFirst(userId){ return !this.requestsOf(userId).some(r=>this.COUNTED.includes(r.status)); },
  limits(userId){ const c=this.cfg(), first=this.isFirst(userId); return {first,min:first?c.minFirst:c.minNext}; },

  /* ----- objectifs (valeurs réelles, jamais simulées) ----- */
  objectives(userId){ const db=Store.read(); const u=db.users.find(x=>x.id===userId); if(!u) return [];
    return (db.withdraw_objectives||[]).filter(o=>o.active!==false&&wdObjType(o.type)).sort((a,b)=>(a.order||0)-(b.order||0)).map(o=>{
      const t=wdObjType(o.type); const target=t&&t.bool?1:Math.max(1,Number(o.target)||1);
      const value=t?Math.max(0,Number(t.get(db,u))||0):0; const done=value>=target; const pct=Math.min(100,Math.round(value/target*100));
      return {id:o.id,title:o.title,description:o.description,type:o.type,bool:!!(t&&t.bool),unit:t?t.unit:'',target,value,pct,done,status:done?'validé':(value>0?'en cours':'non commencé')}; }); },

  /* ----- frais de déblocage ----- */
  unlockState(userId){ const c=this.cfg(); const list=UnlockPay.list(userId);
    if(!(c.unlockFee>0)) return {state:'non requis',fee:0,list};
    const paid=list.find(p=>p.status==='validé'), pend=list.find(p=>p.status==='en attente'), last=list[0];
    if(paid) return {state:'payé',fee:c.unlockFee,list,payment:paid};
    if(pend) return {state:'en attente',fee:c.unlockFee,list,payment:pend};
    if(last&&last.status==='refusé') return {state:'refusé',fee:c.unlockFee,list,payment:last};
    return {state:'à payer',fee:c.unlockFee,list}; },

  /* ----- éligibilité globale ----- */
  eligibility(userId){ const cfg=this.cfg(), lim=this.limits(userId), first=lim.first;
    const objs=this.objectives(userId), un=this.unlockState(userId), open=this.open(userId), payout=this.payout(userId), w=Wallet.get(userId);
    /* Les conditions de déblocage ne s'appliquent qu'avant le premier retrait. */
    const objOk=!first||objs.every(o=>o.done);
    const unlockOk=!first||un.state==='non requis'||un.state==='payé';
    const allOk=cfg.enabled&&objOk&&unlockOk;
    const blockers=[];
    if(!cfg.enabled) blockers.push('Les retraits sont temporairement suspendus.');
    if(!unlockOk) blockers.push(un.state==='en attente'?'Ton paiement de déblocage est en cours de vérification.':'Les frais de déblocage doivent être payés.');
    if(!objOk) blockers.push('Tous les objectifs doivent être validés.');
    if(allOk&&open) blockers.push('Une demande de retrait est déjà en cours de traitement.');
    if(allOk&&!open&&!payout) blockers.push('Enregistre ton moyen de paiement.');
    if(allOk&&!open&&payout&&w.balance<lim.min) blockers.push('Solde insuffisant : minimum '+fcfa(lim.min)+'.');
    return {cfg,limits:lim,first,objectives:objs,unlock:un,open,payout,balance:w.balance,objOk,unlockOk,allOk,blockers,
      canRequest:allOk&&!open&&!!payout&&w.balance>=lim.min}; },

  /* ----- validation d'un montant (même logique pour l'aperçu et pour la demande) ----- */
  validateAmount(userId,raw){
    const el=this.eligibility(userId), lim=el.limits;
    if(!el.cfg.enabled) return wdErr('Les retraits sont temporairement suspendus.');
    if(!el.unlockOk) return wdErr(el.unlock.state==='en attente'?'Ton paiement de déblocage est en cours de vérification.':'Paye d\u2019abord les frais de déblocage de '+fcfa(el.cfg.unlockFee)+'.');
    if(!el.objOk) return wdErr('Valide d\u2019abord tous les objectifs à atteindre.');
    if(el.open) return wdErr('Une demande est déjà en cours (réf. '+el.open.ref+'). Attends son traitement avant d\u2019en faire une nouvelle.');
    if(!el.payout) return wdErr('Enregistre d\u2019abord ton moyen de paiement.');
    if(raw===''||raw==null) return wdErr('Saisis le montant à retirer.');
    const amount=Number(raw);
    if(!Number.isFinite(amount)||!Number.isInteger(amount)||amount<=0) return wdErr('Saisis un montant entier, en F CFA.');
    if(amount<lim.min) return wdErr(lim.first?'Pour ton premier retrait, le montant minimum est de '+fcfa(lim.min)+'.':'À partir du 2ᵉ retrait, le montant minimum est de '+fcfa(lim.min)+'.');
    if(amount>el.balance) return wdErr('Solde insuffisant : tu disposes de '+fcfa(el.balance)+' (il te manque '+fcfa(amount-el.balance)+').');
    return {ok:true,amount,el}; },

  /* ----- création d'une demande : débit immédiat du solde (réservation) ----- */
  request(userId,raw){
    const v=this.validateAmount(userId,raw); if(!v.ok) return v;
    const {amount,el}=v; const now=new Date().toISOString(); const ref='WD-'+genCode(7); const id=uid();
    const snap={first:el.first,min:el.limits.min,balanceBefore:el.balance,
      unlock:el.unlock.state,objDone:el.objectives.filter(o=>o.done).length,objTotal:el.objectives.length};
    Store.mutate(db=>{ const w=db.wallets.find(x=>x.userId===userId); if(w.balance<amount) return; w.balance-=amount;
      db.withdrawal_requests=db.withdrawal_requests||[];
      db.withdrawal_requests.unshift({id,ref,userId,amount,method:el.payout.method,phone:el.payout.phone,status:'en attente',reason:'',snap,createdAt:now,reviewedAt:null,reviewedBy:null,paidAt:null});
      db.wallet_transactions.unshift({id:uid(),userId,type:'retrait',label:'Demande de retrait · '+this.methodName(el.payout.method),amount,status:'en attente',ref,gameId:null,meta:{requestId:id,phone:el.payout.phone},date:now}); });
    if(!this.requestsOf(userId).some(r=>r.id===id)) return wdErr('Solde insuffisant.');
    logSecurity(userId,'retrait_demande','Demande '+ref+' · '+amount+' F CFA');
    Notif.add(userId,{title:'Demande de retrait enregistrée',msg:'Ta demande de '+fcfa(amount)+' (réf. '+ref+') est en attente de validation.',cat:'portefeuille'});
    return {ok:true,request:this.requestsOf(userId)[0]}; },

  /* ----- décision de l'administrateur ----- */
  review(id,decision,reason){ const adm=Admin.me(); if(!adm) return wdErr('Accès réservé à l\u2019administrateur.');
    const r=(Store.read().withdrawal_requests||[]).find(x=>x.id===id); if(!r) return wdErr('Demande introuvable.');
    const T={'en attente':['validé','refusé'],'validé':['payé','refusé']};
    if(!(T[r.status]||[]).includes(decision)) return wdErr('Action impossible : la demande est « '+r.status+' ».');
    reason=String(reason||'').trim();
    if(decision==='refusé'&&reason.length<3) return wdErr('Indique le motif du refus.');
    const now=new Date().toISOString();
    Store.mutate(db=>{ const q=db.withdrawal_requests.find(x=>x.id===id); q.status=decision; q.reviewedAt=now; q.reviewedBy=adm.id;
      if(decision==='refusé'){ q.reason=reason; const w=db.wallets.find(x=>x.userId===q.userId); w.balance+=q.amount; }
      if(decision==='payé') q.paidAt=now;
      const tx=db.wallet_transactions.find(t=>t.meta&&t.meta.requestId===id); if(tx){ tx.status=decision; if(reason) tx.meta.reason=reason; } });
    logSecurity(adm.id,'admin_retrait',r.ref+' → '+decision+(reason?' ('+reason+')':''));
    const M={'validé':['Retrait validé','Ta demande '+r.ref+' de '+fcfa(r.amount)+' a été validée. Le paiement suit.'],
      'payé':['Retrait payé','Ta demande '+r.ref+' de '+fcfa(r.amount)+' a été payée sur '+r.phone+'.'],
      'refusé':['Retrait refusé','Ta demande '+r.ref+' a été refusée : '+reason+'. Les '+fcfa(r.amount)+' ont été recrédités sur ton solde.']};
    Notif.add(r.userId,{title:M[decision][0],msg:M[decision][1],cat:'portefeuille'}); return {ok:true}; },

  /* ----- objectifs : gestion admin ----- */
  saveObjective(o){ if(!Admin.me()) return wdErr('Accès réservé à l\u2019administrateur.');
    const title=String(o.title||'').trim(), desc=String(o.description||'').trim(), t=wdObjType(o.type);
    if(title.length<3) return wdErr('Donne un titre à l\u2019objectif (3 caractères minimum).');
    if(!t) return wdErr('Choisis un type d\u2019objectif.');
    const target=t.bool?1:Number(o.target); if(!Number.isInteger(target)||target<1) return wdErr('La valeur à atteindre doit être un entier supérieur à 0.');
    Store.mutate(db=>{ db.withdraw_objectives=db.withdraw_objectives||[];
      if(o.id){ const x=db.withdraw_objectives.find(q=>q.id===o.id); if(x) Object.assign(x,{title,description:desc,type:t.id,target,active:o.active!==false}); }
      else db.withdraw_objectives.push({id:uid(),title,description:desc,type:t.id,target,active:o.active!==false,order:db.withdraw_objectives.length+1}); });
    logSecurity(Admin.me().id,'admin_objectif',(o.id?'Modifié : ':'Créé : ')+title); return {ok:true}; },
  deleteObjective(id){ if(!Admin.me()) return wdErr('Accès réservé à l\u2019administrateur.');
    Store.mutate(db=>{ db.withdraw_objectives=(db.withdraw_objectives||[]).filter(x=>x.id!==id); }); return {ok:true}; },
  toggleObjective(id){ if(!Admin.me()) return wdErr('Accès réservé à l\u2019administrateur.');
    Store.mutate(db=>{ const x=(db.withdraw_objectives||[]).find(q=>q.id===id); if(x) x.active=x.active===false; }); return {ok:true}; },
  moveObjective(id,dir){ if(!Admin.me()) return wdErr('Accès réservé à l\u2019administrateur.');
    Store.mutate(db=>{ const l=(db.withdraw_objectives||[]).sort((a,b)=>(a.order||0)-(b.order||0)); const i=l.findIndex(x=>x.id===id); const j=i+dir;
      if(i<0||j<0||j>=l.length) return; [l[i],l[j]]=[l[j],l[i]]; l.forEach((x,k)=>x.order=k+1); }); return {ok:true}; },

  /* ----- statistiques admin ----- */
  stats(){ const db=Store.read(); const rq=db.withdrawal_requests||[], up=db.unlock_payments||[];
    const sum=l=>l.reduce((s,x)=>s+x.amount,0);
    return {pendingN:rq.filter(r=>r.status==='en attente').length, validatedN:rq.filter(r=>r.status==='validé').length,
      requested:sum(rq.filter(r=>r.status!=='refusé')), paid:sum(rq.filter(r=>r.status==='payé')),
      toVerify:up.filter(p=>p.status==='en attente').length, feesCollected:sum(up.filter(p=>p.status==='validé'))}; }
};

/* ---------- Paiements de déblocage ---------- */
const UnlockPay={
  list(userId){ return (Store.read().unlock_payments||[]).filter(p=>p.userId===userId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); },
  submit(userId,d){ const c=WD.cfg(); const st=WD.unlockState(userId);
    if(!(c.unlockFee>0)) return wdErr('Aucun frais de déblocage n\u2019est requis.');
    if(st.state==='payé') return wdErr('Tes frais de déblocage sont déjà payés.');
    if(st.state==='en attente') return wdErr('Un paiement est déjà en cours de vérification.');
    if(!CONFIG.WITHDRAW.methods.some(m=>m.id===d.operator)) return wdErr('Choisis un opérateur.');
    const merchant=c.merchants[d.operator]; if(!merchant) return wdErr('Ce moyen de paiement n\u2019est pas encore disponible : le numéro marchand n\u2019est pas configuré.');
    const phone=String(d.phone||'').trim(); if(!WD_PHONE_RE.test(phone)) return wdErr('Ton numéro de paiement est invalide.');
    const txRef=String(d.txRef||'').trim(); if(!/^[A-Za-z0-9._\-]{6,32}$/.test(txRef)) return wdErr('Référence de transaction invalide (6 à 32 caractères, lettres et chiffres).');
    if((Store.read().unlock_payments||[]).some(p=>p.status!=='refusé'&&p.txRef.toLowerCase()===txRef.toLowerCase())) return wdErr('Cette référence de transaction a déjà été utilisée.');
    const now=new Date().toISOString();
    Store.mutate(db=>{ db.unlock_payments=db.unlock_payments||[]; db.unlock_payments.unshift({id:uid(),userId,amount:c.unlockFee,operator:d.operator,phone,txRef,merchant,status:'en attente',reason:'',createdAt:now,reviewedAt:null,reviewedBy:null}); });
    logSecurity(userId,'deblocage_paiement','Paiement déclaré · réf. '+txRef);
    Notif.add(userId,{title:'Paiement de déblocage reçu',msg:'Ton paiement de '+fcfa(c.unlockFee)+' (réf. '+txRef+') est en cours de vérification.',cat:'portefeuille'});
    return {ok:true}; },
  review(id,decision,reason){ const adm=Admin.me(); if(!adm) return wdErr('Accès réservé à l\u2019administrateur.');
    const p=(Store.read().unlock_payments||[]).find(x=>x.id===id); if(!p) return wdErr('Paiement introuvable.');
    if(p.status!=='en attente') return wdErr('Ce paiement a déjà été traité.');
    if(!['validé','refusé'].includes(decision)) return wdErr('Décision invalide.');
    reason=String(reason||'').trim(); if(decision==='refusé'&&reason.length<3) return wdErr('Indique le motif du refus.');
    Store.mutate(db=>{ const q=db.unlock_payments.find(x=>x.id===id); q.status=decision; q.reason=decision==='refusé'?reason:''; q.reviewedAt=new Date().toISOString(); q.reviewedBy=adm.id; });
    logSecurity(adm.id,'admin_deblocage',p.txRef+' → '+decision+(reason?' ('+reason+')':''));
    Notif.add(p.userId,decision==='validé'
      ?{title:'Compte débloqué',msg:'Ton paiement de '+fcfa(p.amount)+' est validé. Les frais de déblocage sont réglés.',cat:'portefeuille'}
      :{title:'Paiement de déblocage refusé',msg:'Ton paiement (réf. '+p.txRef+') n\u2019a pas été validé : '+reason+'. Tu peux réessayer.',cat:'portefeuille'});
    return {ok:true}; }
};

    <div class="adm-checks">${adChk(s.unlock==='payé'||s.unlock==='non requis'||s.first===false,'Frais de déblocage '+(s.unlock==='non requis'?'non requis':(s.first===false?'déjà réglés':'payés')))}

function adDo(kind,id,decision,reason){ const r=kind==='wd'?WD.review(id,decision,reason):UnlockPay.review(id,decision,reason);

    actions:`<button class="btn btn-outline" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="closeModal();adDo('${kind}','${id}','${decision}')">${ic('check')}Confirmer</button>`}); }

function saveProfile(){ clearErrs(); const u=Auth.currentUser(); const db=Store.read();

  else if(db.users.some(x=>x.id!==u.id&&!x.isSeed&&x.email.toLowerCase()===d.email.toLowerCase())){setErr('pf-email','Cet e-mail est déjà utilisé.');ok=false;}

  priv:{t:'Politique de confidentialité',b:'<div style="font-size:13.5px;color:#4B5563;line-height:1.9"><p><b>Données collectées :</b> identité, coordonnées, données de portefeuille, d’inventaire et de commande, historique de portefeuille.</p><p><b>Finalités :</b> fonctionnement du service, sécurité, lutte contre la fraude, amélioration de l\u2019expérience.</p><p><b>Protection :</b> mots de passe hachés, accès contrôlés par utilisateur (Row Level Security), journalisation des opérations sensibles, aucune exposition de clés secrètes côté client.</p><p><b>Droits :</b> tu peux demander l\u2019accès, la rectification ou la suppression de tes données via le centre d\u2019assistance.</p></div>'},
  faq:{t:'Questions fréquentes',b:'<details class="faq"><summary>Que sont les CLI ?</summary><div class="a">Ce sont des crédits internes. 1 000 F CFA correspondent à 1 000 CLI après confirmation du paiement par un prestataire réellement connecté. Cette version ne connecte aucun prestataire.</div></details>'
    +'<details class="faq"><summary>Les prix et reventes sont-ils garantis ?</summary><div class="a">Non. Les prix, valeurs de revente, frais et délais sont estimatifs. Une demande de revente ne garantit ni acheteur ni crédit de CLI.</div></details>'
    +'<details class="faq"><summary>Comment fonctionne le parrainage ?</summary><div class="a">Tu partages ton lien personnel. Les récompenses ne sont attribuées qu\u2019après inscription réelle, confirmation et vérification du compte de ton filleul — jamais sur un simple clic.</div></details>'
    +'<details class="faq"><summary>Comment retirer mes gains ?</summary><div class="a">Depuis la page « Retrait » : règle une seule fois les frais de déblocage ('+fcfa(WD.cfg().unlockFee)+'), valide tes objectifs, puis fais ta demande. Minimum '+fcfa(WD.cfg().minFirst)+' pour le premier retrait, '+fcfa(WD.cfg().minNext)+' ensuite. Chaque demande est vérifiée avant paiement.</div></details>'
    },
  about:{t:'À propos de Clicash',b:'<div style="text-align:center;margin-bottom:14px"><div class="tb-logo floaty" style="width:56px;height:56px;border-radius:18px;margin:0 auto">'+logoImg()+'</div><h3 style="margin-top:10px">Clicash</h3><p style="color:var(--gray);font-size:13px">Version client 1.0 · 2026</p></div>'
    +'<div style="font-size:13.5px;color:#4B5563;line-height:1.9"><p>Clicash est une marketplace électronique pensée pour l\u2019Afrique francophone, avec une première orientation vers le Togo. Les estimations de prix sont indicatives et la version actuelle fonctionne localement sur cet appareil.</p><p style="margin-top:8px"><b>Référence :</b> 1 Cli = 1 FCFA (équivalence indicative). Les récompenses convertibles et paiements réels seront activés après vérification des exigences légales, des opérateurs et des conditions d\u2019âge applicables.</p></div>'} };
  const c=C[kind]; openModal({title:c.t,wide:kind==='faq'||kind==='cgu'||kind==='priv',body:c.b,actions:'<button class="btn btn-primary" onclick="closeModal()">Fermer</button>'}); }
function openHelp(){ openModal({title:'Centre d\u2019assistance',
  body:'<p style="font-size:13px;color:var(--gray);margin-bottom:14px">Décris ton problème : notre équipe te répondra. Tu peux aussi consulter la FAQ.</p>'
  +'<form id="spForm" novalidate><div class="field"><label>Sujet</label><input class="input" id="sp-subj" placeholder="Ex. Question sur mes Cli"><div class="f-err"></div></div>'
  +'<div class="field"><label>Message</label><textarea class="input" id="sp-msg" placeholder="Décris ta demande…"></textarea><div class="f-err"></div></div></form>',
  actions:'<button class="btn btn-outline" onclick="closeModal();openLegal(\'faq\')">'+ic('help-circle')+'FAQ</button><button class="btn btn-primary" onclick="sendSupport()">'+ic('send')+'Envoyer</button>'}); }
function sendSupport(){ clearErrs(); const s=$('#sp-subj').value.trim(),m=$('#sp-msg').value.trim(); let ok=true;
  if(s.length<4){setErr('sp-subj','Sujet trop court.');ok=false;}
  if(m.length<10){setErr('sp-msg','Message trop court (10 caractères min.).');ok=false;}
  if(!ok) return; const u=Auth.currentUser();
  Store.mutate(db=>db.support_requests.unshift({id:uid(),userId:u.id,subject:s,message:m,status:'ouvert',date:new Date().toISOString()}));
  Notif.add(u.id,{title:'Demande d\u2019assistance envoyée',msg:'Ta demande « '+s+' » a bien été enregistrée.',cat:'systeme'});
  closeModal(); toast('Demande envoyée. Nous reviendrons vers toi.','ok','send'); }

/* ---------- NOTIFICATIONS ---------- */
VIEWS.notifications={active:'notifications',
render(u){ const list=Notif.list(u.id);
  const CAT={systeme:['info','#E7F6EC','#16A34A'],publicite:['tv','#DDF5E6','#15803D'],creator:['clapperboard','#F0EDFF','#6B4EFF'],parrainage:['users','#EAF9F0','#0B9A57'],portefeuille:['wallet','#FFF4E0','#B25E00'],securite:['shield-check','#FEEBEB','#C13515']};
  return '<div class="sec-head" style="margin-top:0"><h2>'+ic('bell')+'Notifications</h2>'
  +(list.some(n=>!n.read)?'<button class="btn btn-ghost btn-sm" onclick="Notif.markAll(Auth.currentUser().id);render()">'+ic('check')+'Tout marquer comme lu</button>':'')+'</div>'
  +'<div class="chips" style="margin-bottom:16px" id="ntChips"><button class="chip active" data-c="all">Toutes</button><button class="chip" data-c="unread">Non lues</button><button class="chip" data-c="read">Lues</button></div>'
  +'<div class="card" id="ntList">'+ntListHTML(list,CAT)+'</div>'; },
mount(){ const CAT={systeme:['info','#E7F6EC','#16A34A'],publicite:['tv','#DDF5E6','#15803D'],creator:['clapperboard','#F0EDFF','#6B4EFF'],parrainage:['users','#EAF9F0','#0B9A57'],portefeuille:['wallet','#FFF4E0','#B25E00'],securite:['shield-check','#FEEBEB','#C13515']};
  $$('#ntChips .chip').forEach(ch=>ch.addEventListener('click',()=>{ $$('#ntChips .chip').forEach(c=>c.classList.remove('active')); ch.classList.add('active');
    let list=Notif.list(Auth.currentUser().id); const c=ch.dataset.c;
    if(c==='unread') list=list.filter(n=>!n.read); if(c==='read') list=list.filter(n=>n.read);
    $('#ntList').innerHTML=ntListHTML(list,CAT); lucide.createIcons(); })); } };
function ntListHTML(list,CAT){ if(!list.length) return emptyState('bell','Aucune notification','Les nouveautés et alertes de ton Empire apparaîtront ici.');
  return '<div class="list">'+list.map(n=>{ const c=CAT[n.cat]||CAT.systeme;
    return '<div class="list-row" style="cursor:pointer;'+(n.read?'opacity:.72':'')+'" onclick="Notif.markRead(\''+n.id+'\');render()">'
    +'<div class="lr-ico" style="background:'+c[1]+';color:'+c[2]+'">'+ic(c[0])+'</div>'
    +'<div class="lr-main"><div class="t">'+esc(n.title)+(n.read?'':' <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-left:4px"></span>')+'</div>'
    +'<div class="s">'+esc(n.msg)+'</div></div>'
    +'<div class="lr-right"><div class="s" style="font-size:11px;color:var(--gray);white-space:nowrap">'+timeAgo(n.date)+'</div><div class="st"><span class="badge b-gray">'+esc(n.cat)+'</span></div></div></div>'; }).join('')+'</div>'; }

/* ================= 8. BOOT ================= */
(function boot(){
  const u=Auth.currentUser();
  if(u&&u.settings&&u.settings.display==='reduit') document.documentElement.classList.add('reduce-motion');
  Store.read();
  /* Lien de parrainage : le code est mémorisé automatiquement jusqu'à l'inscription */
  let refToast=null;
  try{ const qs=new URLSearchParams(location.search);
    if(qs.has('ref')){ const code=Referral.normalize(qs.get('ref'));
      if(Referral.valid(code)){
        if(u) refToast='Tu as déjà un compte : un lien de parrainage ne s\u2019applique qu\u2019aux nouvelles inscriptions.';
        else { Referral.capture(code); if(!location.hash||/^#\/?(welcome)?$/.test(location.hash)) location.hash='#/signup'; } }
      qs.delete('ref'); const rest=qs.toString();
      try{ history.replaceState(null,'',location.pathname+(rest?'?'+rest:'')+location.hash); }catch(e){} } }catch(e){}
  if(u){ touchDevice(u.id); Referral.reconcile(u.id); }
  _suT=Date.now();
  if(!location.hash) location.hash=(Session.current()&&!Session.current().expired)?'#/home':'#/welcome';
  route();
  if(refToast) setTimeout(()=>toast(refToast,'info','info'),500);
})();
</script>
